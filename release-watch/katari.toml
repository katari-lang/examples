[package]
name = "release_watch"
description = "A GitHub release monitor managed from Discord: watch/unwatch repositories in a channel, get new releases announced on a durable schedule."

[runtime]
url = "http://localhost:3000"

[dependencies]
registry = "https://raw.githubusercontent.com/katari-lang/katari-registry/main"
snapshot = "snapshot-2026-07-30-ae82151a"
packages = ["web", "discord", "fleet"]
